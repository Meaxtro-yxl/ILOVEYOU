<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>甜蜜点菜</title>
<style>
:root{--pink:#E91E63;--pink-light:#FCE4EC;--warm:#FFF3E0;--green:#4CAF50;--orange:#FF9800;--gray:#9E9E9E;--card-shadow:0 2px 8px rgba(0,0,0,.08);--radius:16px;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#FCE4EC,#FFF3E0,#FCE4EC);min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:80px}
.header{background:linear-gradient(135deg,#F8BBD0,#E91E63);color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(233,30,99,.2)}
.header h1{font-size:22px;font-weight:700;letter-spacing:2px}
.header .sub{font-size:12px;opacity:.85;margin-top:2px}
.nickname-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;background:rgba(255,255,255,.6);font-size:13px;color:#666}
.nickname-bar button{background:none;border:1px solid #E91E63;color:#E91E63;padding:4px 12px;border-radius:12px;font-size:12px;cursor:pointer}
.tabs{display:flex;background:#fff;border-bottom:1px solid #f0f0f0;position:sticky;top:76px;z-index:99}
.tab{flex:1;text-align:center;padding:14px 0;font-size:13px;font-weight:600;color:#999;cursor:pointer;transition:all .2s;border-bottom:3px solid transparent}
.tab.active{color:#E91E63;border-bottom-color:#E91E63}
.tab .emoji{font-size:18px;margin-right:2px}
.content{flex:1;padding:16px;overflow-y:auto}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;-webkit-overflow-scrolling:touch}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-tag{padding:8px 16px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#666;transition:all .2s;flex-shrink:0}
.cat-tag.active{background:#E91E63;color:#fff;border-color:#E91E63}

/* 菜品 */
.dish-card{background:#fff;border-radius:var(--radius);padding:14px 36px 14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--card-shadow);transition:transform .15s;position:relative}
.dish-card:active{transform:scale(.98)}
.dish-info{flex:1;min-width:0}
.dish-name{font-size:15px;font-weight:600;color:#333}
.dish-cute{font-size:12px;color:#E91E63;margin-top:2px;display:flex;align-items:center;gap:4px}
.dish-del{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:none;background:transparent;color:#ccc;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0;line-height:1}
.dish-del:hover{color:#E91E63;background:rgba(233,30,99,.08)}
.qty-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qty-btn{width:30px;height:30px;border-radius:50%;border:2px solid #E91E63;background:#fff;color:#E91E63;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;line-height:1;padding:0}
.qty-btn:active{background:#E91E63;color:#fff}
.qty-btn.zero{border-color:#ddd;color:#ddd}
.qty-num{font-size:16px;font-weight:700;color:#333;min-width:20px;text-align:center}
.add-custom{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;margin-top:8px;border:2px dashed #E91E63;border-radius:var(--radius);color:#E91E63;font-size:14px;cursor:pointer;background:rgba(233,30,99,.04);transition:all .2s}
.add-custom:active{background:rgba(233,30,99,.1)}

/* 底部栏 */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.1);border-radius:var(--radius) var(--radius) 0 0;padding:12px 16px;z-index:100}
.bottom-bar .summary{font-size:13px;color:#666;max-height:60px;overflow-y:auto}
.bottom-bar .summary span{color:#E91E63;font-weight:600}
.bottom-bar .total{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0}
.bottom-bar .total .cute-total{font-size:18px;font-weight:800;color:#E91E63}
.bottom-bar .total .count{font-size:13px;color:#999}

/* 配方搜索 */
.recipe-search{width:100%;padding:12px 16px;border:2px solid #F8BBD0;border-radius:24px;font-size:15px;outline:none;margin-bottom:12px;transition:border .2s}
.recipe-search:focus{border-color:#E91E63}

/* 食材分组折叠 */
.ingredient-group{background:#fff;border-radius:12px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);transition:all .2s}
.ingredient-group.open{border-left:3px solid #E91E63}
.ingredient-header{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:background .15s}
.ingredient-header:active{background:#fafafa}
.ingredient-group.open .ingredient-header{background:#FCE4EC}
.ingredient-name-row{display:flex;align-items:center;gap:8px}
.ingredient-emoji{font-size:20px}
.ingredient-label{font-weight:600;font-size:15px;color:#333}
.ingredient-count{background:#FCE4EC;color:#E91E63;padding:1px 8px;border-radius:10px;font-size:11px}
.ingredient-group.open .ingredient-count{background:#E91E63;color:#fff}
.ingredient-arrow{font-size:11px;color:#999;transition:transform .25s}
.ingredient-group.open .ingredient-arrow{color:#E91E63;transform:rotate(180deg)}
.ingredient-recipes{max-height:0;overflow:hidden;transition:max-height .35s ease}
.ingredient-group.open .ingredient-recipes{max-height:800px}
.ingredient-recipe-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 10px 20px;border-top:1px solid #f8f8f8;font-size:14px}
.ingredient-recipe-item:active{background:#fafafa}
.ingredient-recipe-name{font-weight:500;color:#333;flex:1}
.ingredient-recipe-ingredients{font-size:11px;color:#999;margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.ingredient-recipe-actions{display:flex;gap:4px;flex-shrink:0;margin-left:8px}
.ir-btn{width:24px;height:24px;border-radius:50%;border:1px solid #e0e0e0;background:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0;line-height:1;color:#999}
.ir-btn:hover{border-color:#E91E63;color:#E91E63}
.ir-btn.del:hover{border-color:#F44336;color:#F44336;background:rgba(244,67,54,.06)}

.search-empty{text-align:center;padding:30px 20px;color:#999;font-size:14px}

/* 心愿输入区 */
.wish-input-row{display:flex;gap:10px;margin-bottom:8px;position:relative}
.wish-input-row input{flex:1;padding:12px 16px;border:2px solid #F8BBD0;border-radius:24px;font-size:15px;outline:none;transition:border .2s}
.wish-input-row input:focus{border-color:#E91E63}
.wish-input-row button{padding:12px 24px;background:linear-gradient(135deg,#F8BBD0,#E91E63);color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.wish-input-row button:active{opacity:.8}
.auto-suggest{position:absolute;top:100%;left:0;right:56px;background:#fff;border:2px solid #F8BBD0;border-top:none;border-radius:0 0 16px 16px;max-height:180px;overflow-y:auto;z-index:50;display:none;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.auto-suggest.show{display:block}
.auto-suggest-item{padding:10px 16px;font-size:14px;color:#333;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f8f8f8}
.auto-suggest-item:last-child{border-bottom:none}
.auto-suggest-item:hover{background:#FCE4EC}
.auto-suggest-item .as-ingredients{font-size:11px;color:#999;margin-left:8px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wish-recipe-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wish-recipe-bar .recipe-pick-btn{font-size:12px;padding:6px 14px;border:1px dashed #E91E63;border-radius:16px;color:#E91E63;background:transparent;cursor:pointer}
.wish-recipe-bar .selected-recipe{font-size:12px;color:#666;background:#FCE4EC;padding:4px 12px;border-radius:12px;display:flex;align-items:center;gap:6px}
.wish-recipe-bar .selected-recipe .clear-recipe{cursor:pointer;color:#E91E63;font-weight:700;font-size:14px}

/* 心愿卡片 */
.wish-card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--card-shadow);position:relative}
.wish-card .wish-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.wish-card .wish-text{font-size:16px;font-weight:600;color:#333;padding-right:24px}
.wish-card .wish-from{font-size:12px;color:#999}
.wish-card .wish-status{padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;flex-shrink:0}
.wish-card .wish-status.pending{background:#FFF3E0;color:#FF9800}
.wish-card .wish-status.accepted{background:#E8F5E9;color:#4CAF50}
.wish-card .wish-status.rejected{background:#f5f5f5;color:#9E9E9E}
.wish-card .wish-actions{display:flex;gap:10px}
.wish-card .wish-actions button{flex:1;padding:10px;border:none;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.wish-card .wish-actions .btn-accept{background:#E8F5E9;color:#4CAF50}
.wish-card .wish-actions .btn-accept:active{background:#4CAF50;color:#fff}
.wish-card .wish-actions .btn-reject{background:#f5f5f5;color:#9E9E9E}
.wish-card .wish-actions .btn-reject:active{background:#9E9E9E;color:#fff}
.wish-card .wish-del{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:#ccc;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0;line-height:1}
.wish-card .wish-del:hover{color:#E91E63;background:rgba(233,30,99,.08)}
.wish-card .wish-recipe-info{margin-top:8px;padding-top:8px;border-top:1px dashed #f0f0f0;font-size:12px;color:#E91E63;cursor:pointer;display:inline-block}
.wish-card .wish-recipe-detail{display:none;margin-top:6px;padding:8px 12px;background:#FCE4EC;border-radius:10px;font-size:12px;color:#666;line-height:1.6}
.wish-card .wish-recipe-detail.show{display:block}
.wish-result{background:linear-gradient(135deg,#FCE4EC,#FFF3E0);border-radius:var(--radius);padding:20px;text-align:center;margin-top:16px}
.wish-result h3{font-size:18px;margin-bottom:8px;color:#E91E63}
.wish-result .verdict{font-size:40px;margin:8px 0}
.wish-result .verdict-sub{font-size:14px;color:#666}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.hidden{display:none}
.modal{background:#fff;width:100%;max-width:480px;border-radius:var(--radius) var(--radius) 0 0;padding:20px;animation:slideUp .25s;max-height:85vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:18px;margin-bottom:16px;color:#333}
.modal input,.modal select,.modal textarea{width:100%;padding:12px;margin-bottom:12px;border:2px solid #e0e0e0;border-radius:12px;font-size:15px;outline:none;font-family:inherit}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#E91E63}
.modal textarea{resize:vertical;min-height:80px}
.modal .modal-btns{display:flex;gap:10px}
.modal .modal-btns button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.modal .btn-cancel{background:#f5f5f5;color:#666}
.modal .btn-confirm{background:linear-gradient(135deg,#F8BBD0,#E91E63);color:#fff}
.recipe-select-list{max-height:50vh;overflow-y:auto}
.recipe-select-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background .15s}
.recipe-select-item:hover{background:#FCE4EC}
.recipe-select-item .rsi-name{font-size:15px;font-weight:600;color:#333}
.recipe-select-item .rsi-ingredients{font-size:12px;color:#999;margin-top:2px}
.recipe-select-item .rsi-check{width:22px;height:22px;border-radius:50%;border:2px solid #e0e0e0;flex-shrink:0;margin-left:12px}
.recipe-select-item.selected .rsi-check{background:#E91E63;border-color:#E91E63}
.recipe-select-none{padding:14px 16px;text-align:center;color:#999;font-size:14px;cursor:pointer;border-bottom:1px solid #f5f5f5}
.recipe-select-none:hover{background:#fafafa}
.nick-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center}
.nick-modal.hidden{display:none}
.nick-box{background:#fff;border-radius:var(--radius);padding:24px;width:85%;max-width:340px;text-align:center}
.nick-box h2{font-size:20px;margin-bottom:4px;color:#E91E63}
.nick-box p{font-size:13px;color:#999;margin-bottom:16px}
.nick-box input{width:100%;padding:12px;border:2px solid #F8BBD0;border-radius:12px;font-size:16px;text-align:center;outline:none;margin-bottom:12px}
.nick-box input:focus{border-color:#E91E63}
.nick-box button{width:100%;padding:12px;background:linear-gradient(135deg,#F8BBD0,#E91E63);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.empty-state{text-align:center;padding:40px 20px;color:#999}
.empty-state .big-emoji{font-size:48px;margin-bottom:12px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:400;background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="app">
  <div class="toast" id="toast"></div>
  <div class="nick-modal" id="nickModal">
    <div class="nick-box">
      <h2>甜蜜点菜</h2>
      <p>输入你的昵称开始点菜吧</p>
      <input id="nickInput" placeholder="比如：宝宝" maxlength="8">
      <button onclick="saveNick()">确认</button>
    </div>
  </div>
  <div class="header">
    <h1>甜蜜点菜</h1>
    <div class="sub">— 两个人的小厨房 —</div>
  </div>
  <div class="nickname-bar">
    <span>👤 <span id="myNick">—</span></span>
    <button onclick="changeNick()">换昵称</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('order')"><span class="emoji">🍳</span>点菜</div>
    <div class="tab" onclick="switchTab('recipe')"><span class="emoji">📝</span>配方库</div>
    <div class="tab" onclick="switchTab('wish')"><span class="emoji">💝</span>心愿菜单</div>
  </div>
  <div class="content" id="content">
    <div id="orderTab">
      <div class="cat-scroll" id="catScroll"></div>
      <div id="dishList"></div>
      <div class="add-custom" onclick="showAddDish()">+ 自定义菜品</div>
    </div>
    <div id="recipeTab" style="display:none">
      <input class="recipe-search" id="recipeSearch" placeholder="🔍 搜索食材或配方..." oninput="renderRecipeTab()">
      <div id="recipeList"></div>
      <div class="add-custom" onclick="showRecipeModal()">+ 新建配方</div>
    </div>
    <div id="wishTab" style="display:none">
      <div class="wish-input-row" id="wishInputRow">
        <input id="wishInput" placeholder="今天想吃...？" maxlength="30" oninput="onWishInput()" onfocus="onWishInput()">
        <button onclick="sendWish()">发送</button>
        <div class="auto-suggest" id="autoSuggest"></div>
      </div>
      <div class="wish-recipe-bar" id="wishRecipeBar">
        <button class="recipe-pick-btn" onclick="showRecipeSelector()">📋 选择配方</button>
        <span id="selectedRecipeLabel" style="display:none"></span>
      </div>
      <div id="wishList"></div>
      <div id="wishResult"></div>
    </div>
  </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <div class="summary" id="orderSummary">暂无已选菜品</div>
  <div class="total">
    <span class="count" id="orderCount">0 道菜</span>
    <span class="cute-total" id="orderCute"></span>
  </div>
</div>

<div class="modal-overlay hidden" id="dishModal">
  <div class="modal">
    <h3>添加自定义菜品</h3>
    <input id="newDishName" placeholder="菜名">
    <select id="newDishCat">
      <option value="荤菜">荤菜</option><option value="素菜">素菜</option>
      <option value="汤品">汤品</option><option value="主食">主食</option><option value="饮品">饮品</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="hideAddDish()">取消</button>
      <button class="btn-confirm" onclick="addCustomDish()">确认添加</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="recipeModal">
  <div class="modal">
    <h3 id="recipeModalTitle">新建配方</h3>
    <input id="recipeName" placeholder="配方名（如：芒果奶昔）" maxlength="50">
    <textarea id="recipeIngredients" placeholder="食材列表，用逗号分隔（如：芒果,牛奶,糯米）"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="hideRecipeModal()">取消</button>
      <button class="btn-confirm" onclick="saveRecipe()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="recipeSelector">
  <div class="modal">
    <h3>选择配方</h3>
    <input style="margin-bottom:12px" id="recipeSelectSearch" placeholder="搜索配方..." oninput="renderRecipeSelectItems()">
    <div class="recipe-select-list">
      <div class="recipe-select-none" onclick="clearRecipeSelection()">不绑定配方</div>
      <div id="recipeSelectItems"></div>
    </div>
    <div style="margin-top:12px">
      <button class="btn-cancel" style="width:100%;padding:12px;border:none;border-radius:12px;font-size:15px;background:#f5f5f5;color:#666;cursor:pointer" onclick="hideRecipeSelector()">关闭</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://xzoctfkbuxumntlvfjgo.supabase.co/rest/v1'
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6b2N0ZmtidXh1bW50bHZmamdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1ODcxMDAsImV4cCI6MjA5NjE2MzEwMH0.vDNGNRpnWlAvaY_FDL244Ujw0jYQL7nT-i3fg8S1KTY'

const CUTE_ACTIONS = ['亲亲', '抱抱', '举高高']
const INGREDIENT_EMOJIS = {
  '芒果':'🥭','草莓':'🍓','香蕉':'🍌','牛油果':'🥑','蓝莓':'🫐','巧克力':'🍫','抹茶':'🍵','红豆':'🫘',
  '珍珠':'🧋','芋头':'🟣','西柚':'🍊','椰奶':'🥥','西米':'⚪','百香果':'🟡','柠檬':'🍋','橙子':'🍊',
  '咖啡':'☕','牛奶':'🥛','酸奶':'🥛','淡奶油':'🧈','蜂蜜':'🍯','冰糖':'🍬','糖':'🍬','鸡蛋':'🥚',
  '糯米':'🍚','大米':'🍚','面粉':'🌾','低筋面粉':'🌾','黄油':'🧈','芝士':'🧀','奶酪':'🧀',
  '鸡肉':'🍗','猪肉':'🐷','牛肉':'🥩','鱼':'🐟','虾':'🦐','土豆':'🥔','番茄':'🍅',
  '辣椒':'🌶️','豆腐':'🧈','黄瓜':'🥒','生菜':'🥬','米粉':'🍜','面条':'🍝',
  '花生':'🥜','核桃':'🟤','红薯':'🍠','紫薯':'🟣','芋圆':'🟡','红豆沙':'🫘',
  '盐':'🧂','酱油':'🫗','醋':'🫗','蒜':'🧄','姜':'🫚','葱':'🧅'
}

async function sbApi(method, path, body) {
  const opts = { method, headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' } }
  if (body) opts.body = JSON.stringify(body)
  const res = await fetch(SB_URL + path, opts)
  if (!res.ok) { const e = await res.text(); throw new Error('API ' + res.status + ': ' + e) }
  const text = await res.text()
  return text ? JSON.parse(text) : []
}

// === 全局状态 ===
let myNick = localStorage.getItem('couple_menu_nick') || ''
let deviceId = localStorage.getItem('couple_menu_device_id') || crypto.randomUUID()
localStorage.setItem('couple_menu_device_id', deviceId)
let dishes = []
let orders = {}
let wishes = []
let recipes = []
let activeCat = '全部'
let selectedRecipeId = null
let editingRecipeId = null
let openIngredientGroups = {}
let pollTimer = null

// === 初始化 ===
function init() {
  if (!myNick) {
    document.getElementById('nickModal').classList.remove('hidden')
  } else {
    document.getElementById('myNick').textContent = myNick
    document.getElementById('nickModal').classList.add('hidden')
    loadAll()
  }
}

function saveNick() {
  const v = document.getElementById('nickInput').value.trim()
  if (!v) return toast('请输入昵称')
  myNick = v
  localStorage.setItem('couple_menu_nick', v)
  document.getElementById('myNick').textContent = myNick
  document.getElementById('nickModal').classList.add('hidden')
  loadAll()
}

function changeNick() {
  document.getElementById('nickInput').value = myNick
  document.getElementById('nickModal').classList.remove('hidden')
}

async function loadAll() {
  try {
    const [dRes, oRes, wRes, rRes] = await Promise.all([
      sbApi('GET', '/dishes?select=*&order=category.asc,id.asc'),
      sbApi('GET', '/orders?select=*'),
      sbApi('GET', '/wishes?select=*&order=created_at.desc'),
      sbApi('GET', '/recipes?select=*&order=created_at.desc')
    ])
    dishes = dRes || []
    orders = {}
    if (oRes) oRes.forEach(function(o) { orders[o.dish_id] = o.quantity })
    wishes = wRes || []
    recipes = rRes || []
    renderAll()
    startPolling()
  } catch(e) {
    console.error('加载失败:', e)
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer)
  pollTimer = setInterval(async function() {
    try {
      const [oRes, wRes, rRes] = await Promise.all([
        sbApi('GET', '/orders?select=*'),
        sbApi('GET', '/wishes?select=*&order=created_at.desc'),
        sbApi('GET', '/recipes?select=*&order=created_at.desc')
      ])
      var newOrders = {}
      oRes.forEach(function(o) { newOrders[o.dish_id] = o.quantity })
      if (JSON.stringify(newOrders) !== JSON.stringify(orders) || JSON.stringify(wRes) !== JSON.stringify(wishes) || JSON.stringify(rRes) !== JSON.stringify(recipes)) {
        orders = newOrders
        wishes = wRes
        recipes = rRes
        renderAll()
      }
    } catch(e) {}
  }, 3000)
}

// === 渲染 ===
function renderAll() {
  renderOrderTab()
  renderRecipeTab()
  renderWishTab()
  renderBottomBar()
}

function renderCategories() {
  var cats = ['全部']
  var seen = {}
  dishes.forEach(function(d) { if (!seen[d.category]) { seen[d.category] = true; cats.push(d.category) } })
  document.getElementById('catScroll').innerHTML = cats.map(function(c) {
    return '<div class="cat-tag' + (c === activeCat ? ' active' : '') + '" onclick="selectCat(\'' + c + '\')">' + c + '</div>'
  }).join('')
}

function getCuteAction(dish) {
  if (dish.cute_action) return dish.cute_action
  var idx = 0
  for (var i = 0; i < (dish.name || '').length; i++) idx += dish.name.charCodeAt(i)
  return CUTE_ACTIONS[idx % 3]
}

function renderOrderTab() {
  renderCategories()
  var filtered = activeCat === '全部' ? dishes : dishes.filter(function(d) { return d.category === activeCat })
  var html = filtered.map(function(d) {
    var qty = orders[d.id] || 0
    var cute = getCuteAction(d)
    return '<div class="dish-card">'
      + '<div class="dish-info"><div class="dish-name">' + d.name + '</div><div class="dish-cute"><span class="cute-icon">💋</span>' + cute + '</div></div>'
      + '<div class="qty-ctrl">'
      + '<button class="qty-btn' + (qty === 0 ? ' zero' : '') + '" onclick="changeQty(' + d.id + ',-1)">−</button>'
      + '<span class="qty-num">' + qty + '</span>'
      + '<button class="qty-btn" onclick="changeQty(' + d.id + ',1)">+</button>'
      + '</div>'
      + '<button class="dish-del" onclick="deleteDish(' + d.id + ')" title="删除">✕</button>'
      + '</div>'
  }).join('')
  document.getElementById('dishList').innerHTML = html || '<div class="empty-state"><div class="big-emoji">🍽️</div>该分类暂无菜品</div>'
}

function renderBottomBar() {
  var items = [], count = 0
  var cuteCounts = { '亲亲': 0, '抱抱': 0, '举高高': 0 }
  for (var did in orders) {
    if (!orders.hasOwnProperty(did) || orders[did] <= 0) continue
    var d = dishes.find(function(dd) { return dd.id == did })
    if (!d) continue
    items.push(d.name + ' ×' + orders[did])
    var cute = getCuteAction(d)
    cuteCounts[cute] += orders[did]
    count += orders[did]
  }
  document.getElementById('orderSummary').innerHTML = items.length ? items.join('、') : '暂无已选菜品'
  document.getElementById('orderCount').textContent = count + ' 道菜'
  var cuteParts = []
  if (cuteCounts['亲亲'] > 0) cuteParts.push('💋亲亲×' + cuteCounts['亲亲'])
  if (cuteCounts['抱抱'] > 0) cuteParts.push('🤗抱抱×' + cuteCounts['抱抱'])
  if (cuteCounts['举高高'] > 0) cuteParts.push('🆙举高高×' + cuteCounts['举高高'])
  document.getElementById('orderCute').textContent = cuteParts.length ? cuteParts.join(' ') : ''
}

// === 配方库 - 食材分组折叠 ===
function getIngredientGroups() {
  var search = (document.getElementById('recipeSearch').value || '').trim().toLowerCase()
  var ingredientMap = {}
  recipes.forEach(function(r) {
    var ings = (r.ingredients || '').split(/[,，]/).map(function(s) { return s.trim() }).filter(Boolean)
    ings.forEach(function(ing) {
      if (!ingredientMap[ing]) ingredientMap[ing] = []
      ingredientMap[ing].push(r)
    })
  })
  var groups = Object.keys(ingredientMap).map(function(ing) {
    return { ingredient: ing, recipes: ingredientMap[ing], count: ingredientMap[ing].length }
  })
  // 按数量降序排列
  groups.sort(function(a, b) { return b.count - a.count })

  if (search) {
    // 搜索时：自动展开匹配的食材组，只显示匹配的配方
    var searchGroups = []
    var autoExpand = {}
    groups.forEach(function(g) {
      var matchIngredient = g.ingredient.toLowerCase().indexOf(search) !== -1
      var matchedRecipes = g.recipes.filter(function(r) {
        return r.name.toLowerCase().indexOf(search) !== -1 || (r.ingredients || '').toLowerCase().indexOf(search) !== -1
      })
      if (matchIngredient || matchedRecipes.length > 0) {
        searchGroups.push({ ingredient: g.ingredient, recipes: matchedRecipes, count: matchedRecipes.length, _matchIngredient: matchIngredient })
        autoExpand[g.ingredient] = true
      }
    })
    if (searchGroups.length > 0) {
      openIngredientGroups = autoExpand
    }
    return searchGroups
  }
  return groups
}

function renderRecipeTab() {
  var groups = getIngredientGroups()
  if (groups.length === 0) {
    var search = (document.getElementById('recipeSearch').value || '').trim()
    document.getElementById('recipeList').innerHTML = search
      ? '<div class="search-empty">🔍 没有找到匹配 <b>"' + search + '"</b> 的食材或配方</div>'
      : '<div class="empty-state"><div class="big-emoji">📝</div>还没有配方，快来创建吧</div>'
    return
  }
  document.getElementById('recipeList').innerHTML = groups.map(function(g) {
    var isOpen = openIngredientGroups[g.ingredient]
    var emoji = INGREDIENT_EMOJIS[g.ingredient] || '🍴'
    return '<div class="ingredient-group' + (isOpen ? ' open' : '') + '" id="ig-' + g.ingredient.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,'') + '">'
      + '<div class="ingredient-header" onclick="toggleIngredientGroup(\'' + g.ingredient.replace(/'/g,"\\'") + '\')">'
      + '<div class="ingredient-name-row">'
      + '<span class="ingredient-emoji">' + emoji + '</span>'
      + '<span class="ingredient-label">' + g.ingredient + '</span>'
      + '<span class="ingredient-count">' + g.count + '个配方</span>'
      + '</div>'
      + '<span class="ingredient-arrow">▼</span>'
      + '</div>'
      + '<div class="ingredient-recipes">'
      + g.recipes.map(function(r) {
        var ings = (r.ingredients || '').split(/[,，]/).map(function(s) { return s.trim() }).filter(Boolean).slice(0, 3).join('、')
        if ((r.ingredients || '').split(/[,，]/).filter(Boolean).length > 3) ings += '...'
        return '<div class="ingredient-recipe-item">'
          + '<span class="ingredient-recipe-name">' + r.name + '</span>'
          + '<span class="ingredient-recipe-ingredients">' + ings + '</span>'
          + '<div class="ingredient-recipe-actions">'
          + '<button class="ir-btn" onclick="event.stopPropagation();editRecipe(' + r.id + ')" title="编辑">✎</button>'
          + '<button class="ir-btn del" onclick="event.stopPropagation();deleteRecipe(' + r.id + ')" title="删除">✕</button>'
          + '</div>'
          + '</div>'
      }).join('')
      + '</div>'
      + '</div>'
  }).join('')
}

function toggleIngredientGroup(ingredient) {
  if (openIngredientGroups[ingredient]) {
    delete openIngredientGroups[ingredient]
  } else {
    openIngredientGroups[ingredient] = true
  }
  var el = document.getElementById('ig-' + ingredient.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,''))
  if (el) el.classList.toggle('open')
}

// === 心愿自动联想 ===
function onWishInput() {
  var val = document.getElementById('wishInput').value.trim().toLowerCase()
  var suggest = document.getElementById('autoSuggest')
  if (!val || recipes.length === 0) {
    suggest.classList.remove('show')
    return
  }
  var matches = recipes.filter(function(r) {
    return r.name.toLowerCase().indexOf(val) !== -1 || (r.ingredients || '').toLowerCase().indexOf(val) !== -1
  }).slice(0, 5)
  if (matches.length === 0) {
    suggest.classList.remove('show')
    return
  }
  suggest.innerHTML = matches.map(function(r) {
    var ings = (r.ingredients || '').split(/[,，]/).slice(0, 3).join('、')
    return '<div class="auto-suggest-item" onclick="selectRecipeSuggestion(' + r.id + ',\'' + r.name.replace(/'/g,"\\'") + '\')">'
      + '<span>' + r.name + '</span>'
      + '<span class="as-ingredients">' + ings + '</span>'
      + '</div>'
  }).join('')
  suggest.classList.add('show')
}

function selectRecipeSuggestion(id, name) {
  document.getElementById('wishInput').value = name
  selectedRecipeId = id
  document.getElementById('autoSuggest').classList.remove('show')
  updateRecipeLabel()
}

document.addEventListener('click', function(e) {
  var row = document.getElementById('wishInputRow')
  if (row && !row.contains(e.target)) {
    document.getElementById('autoSuggest').classList.remove('show')
  }
})

// === 心愿渲染 ===
function renderWishTab() {
  var wishInput = document.getElementById('wishInput')
  var currentVal = wishInput.value
  if (wishes.length === 0) {
    document.getElementById('wishList').innerHTML = '<div class="empty-state"><div class="big-emoji">💌</div>还没有心愿，快发一个吧</div>'
  } else {
    document.getElementById('wishList').innerHTML = wishes.map(function(w) {
      var isMine = w.from_user === myNick
      var isPending = w.status === 'pending'
      var statusLabel = w.status === 'pending' ? '等待中' : (w.status === 'accepted' ? '✅ 想吃' : '❌ 不想吃')
      var actions = ''
      if (isPending && !isMine) {
        actions = '<div class="wish-actions">'
          + '<button class="btn-accept" onclick="respondWish(' + w.id + ',\'accepted\')">😋 想吃</button>'
          + '<button class="btn-reject" onclick="respondWish(' + w.id + ',\'rejected\')">🙅 不想吃</button>'
          + '</div>'
      } else if (isPending && isMine) {
        actions = '<div style="font-size:12px;color:#999">等待对方回应...</div>'
      }
      var recipeInfo = ''
      if (w.recipe_id) {
        var recipe = recipes.find(function(r) { return r.id == w.recipe_id })
        if (recipe) {
          recipeInfo = '<div class="wish-recipe-info" onclick="toggleWishRecipe(event,' + w.id + ')">📋 配方：' + recipe.name + ' ▸</div>'
            + '<div class="wish-recipe-detail" id="wishRecipeDetail-' + w.id + '">'
            + (recipe.ingredients || '').split(/[,，]/).map(function(ing) { return '🥄 ' + ing.trim() }).join('<br>')
            + '</div>'
        }
      }
      return '<div class="wish-card">'
        + '<div class="wish-top"><span class="wish-text">' + w.wish_text + '</span><span class="wish-status ' + w.status + '">' + statusLabel + '</span></div>'
        + '<div class="wish-from">来自：' + w.from_user + '</div>'
        + recipeInfo
        + actions
        + '<button class="wish-del" onclick="deleteWish(' + w.id + ')" title="删除心愿">✕</button>'
        + '</div>'
    }).join('')
  }
  wishInput.value = currentVal
  var accepted = wishes.filter(function(w) { return w.status === 'accepted' })
  var rejected = wishes.filter(function(w) { return w.status === 'rejected' })
  var pending = wishes.filter(function(w) { return w.status === 'pending' })
  if (accepted.length > 0 || rejected.length > 0) {
    var verdictHTML = ''
    if (accepted.length > 0) {
      verdictHTML += '<div class="verdict">😋</div><div class="verdict-sub">' + accepted.map(function(w) { return w.wish_text }).join('、') + ' — 达成共识！</div>'
    }
    if (rejected.length > 0) {
      verdictHTML += '<div style="margin-top:8px;font-size:14px;color:#999">❌ ' + rejected.map(function(w) { return w.wish_text }).join('、') + ' 被拒绝了</div>'
    }
    if (pending.length > 0) {
      verdictHTML += '<div style="margin-top:8px;font-size:14px;color:#FF9800">⏳ ' + pending.map(function(w) { return w.wish_text }).join('、') + ' 等待回应</div>'
    }
    document.getElementById('wishResult').innerHTML = '<div class="wish-result"><h3>💝 心愿结果</h3>' + verdictHTML + '</div>'
  } else {
    document.getElementById('wishResult').innerHTML = ''
  }
}

function toggleWishRecipe(e, wishId) {
  e.stopPropagation()
  var detail = document.getElementById('wishRecipeDetail-' + wishId)
  if (detail) detail.classList.toggle('show')
}

// === Tab ===
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active') })
  document.getElementById('orderTab').style.display = tab === 'order' ? 'block' : 'none'
  document.getElementById('recipeTab').style.display = tab === 'recipe' ? 'block' : 'none'
  document.getElementById('wishTab').style.display = tab === 'wish' ? 'block' : 'none'
  document.getElementById('bottomBar').style.display = tab === 'order' ? 'block' : 'none'
  var idx = tab === 'order' ? 0 : (tab === 'recipe' ? 1 : 2)
  document.querySelectorAll('.tab')[idx].classList.add('active')
  if (tab === 'wish') document.getElementById('autoSuggest').classList.remove('show')
}

// === 菜品操作 ===
function selectCat(cat) { activeCat = cat; renderOrderTab() }

async function changeQty(dishId, delta) {
  var cur = orders[dishId] || 0
  var nxt = Math.max(0, cur + delta)
  try {
    if (nxt === 0) {
      await sbApi('DELETE', '/orders?dish_id=eq.' + dishId)
    } else {
      await sbApi('POST', '/orders', { dish_id: dishId, quantity: nxt, updated_by: myNick, updated_at: new Date().toISOString() })
    }
  } catch(e) { return toast('操作失败，请重试') }
  loadAll()
}

async function deleteDish(dishId) {
  var dish = dishes.find(function(d) { return d.id == dishId })
  if (!dish) return
  if (!confirm('确定删除菜品「' + dish.name + '」吗？删除后不可恢复。')) return
  try {
    await Promise.all([
      sbApi('DELETE', '/dishes?id=eq.' + dishId),
      sbApi('DELETE', '/orders?dish_id=eq.' + dishId)
    ])
  } catch(e) { return toast('删除失败，请重试') }
  loadAll()
}

function showAddDish() { document.getElementById('dishModal').classList.remove('hidden') }
function hideAddDish() { document.getElementById('dishModal').classList.add('hidden') }

async function addCustomDish() {
  var name = document.getElementById('newDishName').value.trim()
  var cat = document.getElementById('newDishCat').value
  if (!name) return toast('请填写菜名')
  try {
    await sbApi('POST', '/dishes', { name: name, category: cat, created_by: myNick })
  } catch(e) { return toast('添加失败，请重试') }
  document.getElementById('newDishName').value = ''
  hideAddDish()
  loadAll()
}

// === 配方操作 ===
function showRecipeModal(id) {
  editingRecipeId = id || null
  document.getElementById('recipeModalTitle').textContent = id ? '编辑配方' : '新建配方'
  document.getElementById('recipeName').value = ''
  document.getElementById('recipeIngredients').value = ''
  if (id) {
    var recipe = recipes.find(function(r) { return r.id == id })
    if (recipe) {
      document.getElementById('recipeName').value = recipe.name
      document.getElementById('recipeIngredients').value = recipe.ingredients
    }
  }
  document.getElementById('recipeModal').classList.remove('hidden')
}

function hideRecipeModal() {
  document.getElementById('recipeModal').classList.add('hidden')
  editingRecipeId = null
}

function editRecipe(id) { showRecipeModal(id) }

async function saveRecipe() {
  var name = document.getElementById('recipeName').value.trim()
  var ingredients = document.getElementById('recipeIngredients').value.trim()
  if (!name || !ingredients) return toast('请填写配方名和食材列表')
  try {
    if (editingRecipeId) {
      await sbApi('PATCH', '/recipes?id=eq.' + editingRecipeId, { name: name, ingredients: ingredients })
    } else {
      await sbApi('POST', '/recipes', { name: name, ingredients: ingredients, created_by: myNick })
    }
  } catch(e) { return toast('保存失败，请重试') }
  hideRecipeModal()
  loadAll()
}

async function deleteRecipe(id) {
  var recipe = recipes.find(function(r) { return r.id == id })
  if (!recipe) return
  if (!confirm('确定删除配方「' + recipe.name + '」吗？')) return
  try {
    await sbApi('DELETE', '/recipes?id=eq.' + id)
  } catch(e) { return toast('删除失败，请重试') }
  loadAll()
}

// === 心愿操作 ===
function updateRecipeLabel() {
  var label = document.getElementById('selectedRecipeLabel')
  if (selectedRecipeId) {
    var recipe = recipes.find(function(r) { return r.id == selectedRecipeId })
    if (recipe) {
      label.innerHTML = '<span class="selected-recipe">📋 ' + recipe.name + ' <span class="clear-recipe" onclick="clearRecipeSelection()">✕</span></span>'
      label.style.display = 'inline'
      return
    }
  }
  label.style.display = 'none'
}

function clearRecipeSelection() { selectedRecipeId = null; updateRecipeLabel(); hideRecipeSelector() }

async function sendWish() {
  var text = document.getElementById('wishInput').value.trim()
  if (!text) return toast('请输入想吃的东西')
  var body = { wish_text: text, from_user: myNick, status: 'pending' }
  if (selectedRecipeId) body.recipe_id = selectedRecipeId
  try { await sbApi('POST', '/wishes', body) } catch(e) { return toast('发送失败，请重试') }
  document.getElementById('wishInput').value = ''
  selectedRecipeId = null
  updateRecipeLabel()
  loadAll()
}

async function respondWish(id, status) {
  try { await sbApi('PATCH', '/wishes?id=eq.' + id, { status: status, responded_by: myNick }) } catch(e) { return toast('操作失败，请重试') }
  loadAll()
}

async function deleteWish(id) {
  var wish = wishes.find(function(w) { return w.id == id })
  if (!wish) return
  if (!confirm('确定删除心愿「' + wish.wish_text + '」吗？')) return
  try { await sbApi('DELETE', '/wishes?id=eq.' + id) } catch(e) { return toast('删除失败，请重试') }
  loadAll()
}

// === 配方选择器 ===
function showRecipeSelector() {
  document.getElementById('recipeSelectSearch').value = ''
  renderRecipeSelectItems()
  document.getElementById('recipeSelector').classList.remove('hidden')
}

function hideRecipeSelector() { document.getElementById('recipeSelector').classList.add('hidden') }

function renderRecipeSelectItems() {
  var search = (document.getElementById('recipeSelectSearch').value || '').toLowerCase()
  var filtered = search ? recipes.filter(function(r) {
    return r.name.toLowerCase().indexOf(search) !== -1 || (r.ingredients || '').toLowerCase().indexOf(search) !== -1
  }) : recipes
  document.getElementById('recipeSelectItems').innerHTML = filtered.map(function(r) {
    var sel = selectedRecipeId === r.id ? ' selected' : ''
    return '<div class="recipe-select-item' + sel + '" onclick="selectRecipeFromPicker(' + r.id + ')">'
      + '<div><div class="rsi-name">' + r.name + '</div><div class="rsi-ingredients">' + (r.ingredients || '').split(/[,，]/).slice(0,4).join('、') + '</div></div>'
      + '<div class="rsi-check">' + (sel ? '✓' : '') + '</div>'
      + '</div>'
  }).join('') || '<div style="padding:20px;text-align:center;color:#999">暂无匹配配方</div>'
}

function selectRecipeFromPicker(id) { selectedRecipeId = id; updateRecipeLabel(); hideRecipeSelector() }

function toast(msg) {
  var t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(function() { t.classList.remove('show') }, 2000)
}

init()
</script>
