async function sbApi(method, path, body) {
  const opts = { method, headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' } }
  if (body) opts.body = JSON.stringify(body)
  const res = await fetch(SB_URL + path, opts)
  if (!res.ok) { const e = await res.text(); throw new Error('API ' + res.status + ': ' + e) }
  const text = await res.text()
  return text ? JSON.parse(text) : []
}

function getIngredientGroups() {
  var search = (document.getElementById('recipeSearch').value || '').trim().toLowerCase()
  var ingredientMap = {}
  recipes.forEach(function(r) {
    var ings = (r.ingredients || '').split(/[,ï¼]/).map(function(s) { return s.trim() }).filter(Boolean)
    ings.forEach(function(ing) {
      if (!ingredientMap[ing]) ingredientMap[ing] = []
      ingredientMap[ing].push(r)
    })
  })
  var groups = Object.keys(ingredientMap).map(function(ing) {
    return { ingredient: ing, recipes: ingredientMap[ing], count: ingredientMap[ing].length }
  })
  // ææ°ééåºæå
  groups.sort(function(a, b) { return b.count - a.count })

  if (search) {
    // æç´¢æ¶ï¼èªå¨å±å¼å¹éçé£æç»ï¼åªæ¾ç¤ºå¹éçéæ¹
    var searchGroups = []
    var autoExpand = {}
    groups.forEach(function(g) {
      var matchIngredient = g.ingredient.toLowerCase().indexOf(search) !== -1
      var matchedRecipes = g.recipes.filter(function(r) {
        return r.name.toLowerCase().indexOf(search) !== -1 || (r.ingredients || '').toLowerCase().indexOf(search) !== -1
      })
      if (matchIngredient || matchedRecipes.length > 0) {
        searchGroups.push({ ingredient: g.ingredient, recipes: matchedRecipes, count: matchedRecipes.length, _matchIngredient: matchIngredient })
        autoExpand[g.ingredient] = true
      }
    })
    if (searchGroups.length > 0) {
      openIngredientGroups = autoExpand
    }
    return searchGroups
  }
  return groups
}

function showRecipeSelector() {
  document.getElementById('recipeSelectSearch').value = ''
  renderRecipeSelectItems()
  document.getElementById('recipeSelector').classList.remove('hidden')
}

function hideRecipeSelector() { document.getElementById('recipeSelector').classList.add('hidden') }

function renderRecipeSelectItems() {
  var search = (document.getElementById('recipeSelectSearch').value || '').toLowerCase()
  var filtered = search ? recipes.filter(function(r) {
    return r.name.toLowerCase().indexOf(search) !== -1 || (r.ingredients || '').toLowerCase().indexOf(search) !== -1
  }) : recipes
  document.getElementById('recipeSelectItems').innerHTML = filtered.map(function(r) {
    var sel = selectedRecipeId === r.id ? ' selected' : ''
    return '<div class="recipe-select-item' + sel + '" onclick="selectRecipeFromPicker(' + r.id + ')">'
      + '<div><div class="rsi-name">' + r.name + '</div><div class="rsi-ingredients">' + (r.ingredients || '').split(/[,ï¼]/).slice(0,4).join('ã') + '</div></div>'
      + '<div class="rsi-check">' + (sel ? 'â' : '') + '</div>'
      + '</div>'
  }).join('') || '<div style="padding:20px;text-align:center;color:#999">ææ å¹ééæ¹</div>'
}

function selectRecipeFromPicker(id) { selectedRecipeId = id; updateRecipeLabel(); hideRecipeSelector() }

function toast(msg) {
  var t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(function() { t.classList.remove('show') }, 2000)
}
