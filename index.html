<!DOCTYPE html>
<html lang=zh-CN>
<head>
<meta charset=UTF-8>
<meta name=viewport content=width=device-width,initial-scale=1.0,user-scalable=no>
<title>甜蜜点菜</title>
<style>
:root{--pink:#E91E63;--pink-light:#FCE4EC;--warm:#FFF3E0;--green:#4CAF50;--orange:#FF9800;--gray:#9E9E9E;--card-shadow:0 2px 8px rgba(0,0,0,.08);--radius:16px;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;background:linear-gradient(135deg,#FCE4EC,#FFF3E0,#FCE4EC);min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:80px}

.header{background:linear-gradient(135deg,#F8BBD0,#E91E63);color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(233,30,99,.2)}
.header h1{font-size:22px;font-weight:700;letter-spacing:2px}
.header .sub{font-size:12px;opacity:.85;margin-top:2px}
.nickname-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;background:rgba(255,255,255,.6);font-size:13px;color:#666}
.nickname-bar button{background:none;border:1px solid #E91E63;color:#E91E63;padding:4px 12px;border-radius:12px;font-size:12px;cursor:pointer}

.tabs{display:flex;background:#fff;border-bottom:1px solid #f0f0f0;position:sticky;top:76px;z-index:99}
.tab{flex:1;text-align:center;padding:14px 0;font-size:15px;font-weight:600;color:#999;cursor:pointer;transition:all .2s;border-bottom:3px solid transparent}
.tab.active{color:#E91E63;border-bottom-color:#E91E63}
.tab .emoji{font-size:18px;margin-right:4px}

.content{flex:1;padding:16px;overflow-y:auto}

.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;-webkit-overflow-scrolling:touch}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-tag{padding:8px 16px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#666;transition:all .2s;flex-shrink:0}
.cat-tag.active{background:#E91E63;color:#fff;border-color:#E91E63}

.dish-card{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--card-shadow);transition:transform .15s}
.dish-card:active{transform:scale(.98)}
.dish-info{flex:1;min-width:0}
.dish-name{font-size:15px;font-weight:600;color:#333}
.dish-price{font-size:13px;color:#E91E63;margin-top:2px}
.dish-price::before{content:'¥'}
.qty-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qty-btn{width:30px;height:30px;border-radius:50%;border:2px solid #E91E63;background:#fff;color:#E91E63;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;line-height:1;padding:0}
.qty-btn:active{background:#E91E63;color:#fff}
.qty-btn.zero{border-color:#ddd;color:#ddd}
.qty-num{font-size:16px;font-weight:700;color:#333;min-width:20px;text-align:center}

.add-custom{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;margin-top:8px;border:2px dashed #E91E63;border-radius:var(--radius);color:#E91E63;font-size:14px;cursor:pointer;background:rgba(233,30,99,.04);transition:all .2s}
.add-custom:active{background:rgba(233,30,99,.1)}

.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.1);border-radius:var(--radius) var(--radius) 0 0;padding:12px 16px;z-index:100}
.bottom-bar .summary{font-size:13px;color:#666;max-height:60px;overflow-y:auto}
.bottom-bar .summary span{color:#E91E63;font-weight:600}
.bottom-bar .total{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0}
.bottom-bar .total .price{font-size:22px;font-weight:800;color:#E91E63}
.bottom-bar .total .count{font-size:13px;color:#999}

.wish-input-wrap{display:flex;gap:10px;margin-bottom:16px}
.wish-input-wrap input{flex:1;padding:12px 16px;border:2px solid #F8BBD0;border-radius:24px;font-size:15px;outline:none;transition:border .2s}
.wish-input-wrap input:focus{border-color:#E91E63}
.wish-input-wrap button{padding:12px 24px;background:linear-gradient(135deg,#F8BBD0,#E91E63);color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.wish-input-wrap button:active{opacity:.8}

.wish-card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--card-shadow)}
.wish-card .wish-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wish-card .wish-text{font-size:16px;font-weight:600;color:#333}
.wish-card .wish-from{font-size:12px;color:#999}
.wish-card .wish-status{padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600}
.wish-card .wish-status.pending{background:#FFF3E0;color:#FF9800}
.wish-card .wish-status.accepted{background:#E8F5E9;color:#4CAF50}
.wish-card .wish-status.rejected{background:#f5f5f5;color:#9E9E9E}
.wish-card .wish-actions{display:flex;gap:10px}
.wish-card .wish-actions button{flex:1;padding:10px;border:none;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.wish-card .wish-actions .btn-accept{background:#E8F5E9;color:#4CAF50}
.wish-card .wish-actions .btn-accept:active{background:#4CAF50;color:#fff}
.wish-card .wish-actions .btn-reject{background:#f5f5f5;color:#9E9E9E}
.wish-card .wish-actions .btn-reject:active{background:#9E9E9E;color:#fff}

.wish-result{background:linear-gradient(135deg,#FCE4EC,#FFF3E0);border-radius:var(--radius);padding:20px;text-align:center;margin-top:16px}
.wish-result h3{font-size:18px;margin-bottom:8px;color:#E91E63}
.wish-result .verdict{font-size:40px;margin:8px 0}
.wish-result .verdict-sub{font-size:14px;color:#666}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.hidden{display:none}
.modal{background:#fff;width:100%;max-width:480px;border-radius:var(--radius) var(--radius) 0 0;padding:20px;animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:18px;margin-bottom:16px;color:#333}
.modal input,.modal select{width:100%;padding:12px;margin-bottom:12px;border:2px solid #e0e0e0;border-radius:12px;font-size:15px;outline:none}
.modal input:focus,.modal select:focus{border-color:#E91E63}
.modal .modal-btns{display:flex;gap:10px}
.modal .modal-btns button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.modal .btn-cancel{background:#f5f5f5;color:#666}
.modal .btn-confirm{background:linear-gradient(135deg,#F8BBD0,#E91E63);color:#fff}

.nick-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center}
.nick-modal.hidden{display:none}
.nick-box{background:#fff;border-radius:var(--radius);padding:24px;width:85%;max-width:340px;text-align:center}
.nick-box h2{font-size:20px;margin-bottom:4px;color:#E91E63}
.nick-box p{font-size:13px;color:#999;margin-bottom:16px}
.nick-box input{width:100%;padding:12px;border:2px solid #F8BBD0;border-radius:12px;font-size:16px;text-align:center;outline:none;margin-bottom:12px}
.nick-box input:focus{border-color:#E91E63}
.nick-box button{width:100%;padding:12px;background:linear-gradient(135deg,#F8BBD0,#E91E63);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}

.empty-state{text-align:center;padding:40px 20px;color:#999}
.empty-state .big-emoji{font-size:48px;margin-bottom:12px}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:400;background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class=app>
  <div class=toast id=toast></div>

  <div class=nick-modal id=nickModal>
    <div class=nick-box>
      <h2>🍽️ 甜蜜点菜</h2>
      <p>输入你的昵称开始点菜吧</p>
      <input id=nickInput placeholder=比如：宝宝 maxlength=8>
      <button onclick=saveNick()>确认</button>
    </div>
  </div>

  <div class=header>
    <h1>💕 甜蜜点菜</h1>
    <div class=sub>— 两个人的小厨房 —</div>
  </div>
  <div class=nickname-bar>
    <span>👤 <span id=myNick>—</span></span>
    <button onclick=changeNick()>换昵称</button>
  </div>

  <div class=tabs>
    <div class=tab active onclick=switchTab('order')><span class=emoji>🍳</span>点菜</div>
    <div class=tab onclick=switchTab('wish')><span class=emoji>💝</span>心愿菜单</div>
  </div>

  <div class=content id=content>
    <div id=orderTab>
      <div class=cat-scroll id=catScroll></div>
      <div id=dishList></div>
      <div class=add-custom onclick=showAddDish()>+ 自定义菜品</div>
    </div>
    <div id=wishTab style=display:none>
      <div class=wish-input-wrap>
        <input id=wishInput placeholder=今天想吃...？ maxlength=30>
        <button onclick=sendWish()>发送</button>
      </div>
      <div id=wishList></div>
      <div id=wishResult></div>
    </div>
  </div>
</div>

<div class=bottom-bar id=bottomBar>
  <div class=summary id=orderSummary>暂无已选菜品</div>
  <div class=total>
    <span class=count id=orderCount>0 道菜</span>
    <span class=price id=orderTotal>¥0</span>
  </div>
</div>

<div class=modal-overlay hidden id=dishModal>
  <div class=modal>
    <h3>添加自定义菜品</h3>
    <input id=newDishName placeholder=菜名>
    <input id=newDishPrice type=number placeholder=价格（元） step=0.01 min=0>
    <select id=newDishCat>
      <option value=荤菜>荤菜</option><option value=素菜>素菜</option>
      <option value=汤品>汤品</option><option value=主食>主食</option><option value=饮品>饮品</option>
    </select>
    <div class=modal-btns>
      <button class=btn-cancel onclick=hideAddDish()>取消</button>
      <button class=btn-confirm onclick=addCustomDish()>确认添加</button>
    </div>
  </div>
</div>

<script>
// === Supabase REST API 直连（无需 CDN） ===
const SB_URL = 'https://xzoctfkbuxumntlvfjgo.supabase.co/rest/v1'
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6b2N0ZmtidXh1bW50bHZmamdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1ODcxMDAsImV4cCI6MjA5NjE2MzEwMH0.vDNGNRpnWlAvaY_FDL244Ujw0jYQL7nT-i3fg8S1KTY'

async function sbApi(method, path, body) {
  const opts = { method, headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' } }
  if (body) opts.body = JSON.stringify(body)
  const res = await fetch(SB_URL + path, opts)
  if (!res.ok) { const e = await res.text(); throw new Error('API ' + res.status + ': ' + e) }
  return res.json()
}

// === 全局状态 ===
let myNick = localStorage.getItem('couple_menu_nick') || ''
let deviceId = localStorage.getItem('couple_menu_device_id') || crypto.randomUUID()
localStorage.setItem('couple_menu_device_id', deviceId)

let dishes = []
let orders = {}
let wishes = []
let activeCat = '全部'
let pollTimer = null

// === 初始化 ===
function init() {
  if (!myNick) {
    document.getElementById('nickModal').classList.remove('hidden')
  } else {
    document.getElementById('myNick').textContent = myNick
    document.getElementById('nickModal').classList.add('hidden')
    loadAll()
  }
}

function saveNick() {
  const v = document.getElementById('nickInput').value.trim()
  if (!v) return toast('请输入昵称')
  myNick = v
  localStorage.setItem('couple_menu_nick', v)
  document.getElementById('myNick').textContent = myNick
  document.getElementById('nickModal').classList.add('hidden')
  loadAll()
}

function changeNick() {
  document.getElementById('nickInput').value = myNick
  document.getElementById('nickModal').classList.remove('hidden')
}

// === 数据加载 ===
async function loadAll() {
  try {
    const [dRes, oRes, wRes] = await Promise.all([
      sbApi('GET', '/dishes?select=*&order=category.asc,id.asc'),
      sbApi('GET', '/orders?select=*'),
      sbApi('GET', '/wishes?select=*&order=created_at.desc')
    ])
    dishes = dRes || []
    orders = {}
    if (oRes) oRes.forEach(function(o) { orders[o.dish_id] = o.quantity })
    wishes = wRes || []
    renderAll()
    startPolling()
  } catch(e) {
    console.error('加载失败:', e)
  }
}

// === 轮询同步（代替 WebSocket Realtime） ===
function startPolling() {
  if (pollTimer) clearInterval(pollTimer)
  pollTimer = setInterval(async function() {
    try {
      const [oRes, wRes] = await Promise.all([
        sbApi('GET', '/orders?select=*'),
        sbApi('GET', '/wishes?select=*&order=created_at.desc')
      ])
      var newOrders = {}
      oRes.forEach(function(o) { newOrders[o.dish_id] = o.quantity })
      if (JSON.stringify(newOrders) !== JSON.stringify(orders) || JSON.stringify(wRes) !== JSON.stringify(wishes)) {
        orders = newOrders
        wishes = wRes
        renderAll()
      }
    } catch(e) {}
  }, 3000)
}

// === 渲染 ===
function renderAll() {
  renderOrderTab()
  renderWishTab()
  renderBottomBar()
}

function renderCategories() {
  var cats = ['全部']
  var seen = {}
  dishes.forEach(function(d) { if (!seen[d.category]) { seen[d.category] = true; cats.push(d.category) } })
  document.getElementById('catScroll').innerHTML = cats.map(function(c) {
    return '<div class=cat-tag' + (c === activeCat ? ' active' : '') + ' onclick=selectCat(\'' + c + '\')>' + c + '</div>'
  }).join('')
}

function renderOrderTab() {
  renderCategories()
  var filtered = activeCat === '全部' ? dishes : dishes.filter(function(d) { return d.category === activeCat })
  var html = filtered.map(function(d) {
    var qty = orders[d.id] || 0
    return '<div class=dish-card>'
      + '<div class=dish-info><div class=dish-name>' + d.name + '</div><div class=dish-price>' + d.price + '</div></div>'
      + '<div class=qty-ctrl>'
      + '<button class=qty-btn' + (qty === 0 ? ' zero' : '') + ' onclick=changeQty(' + d.id + ',-1)>−</button>'
      + '<span class=qty-num>' + qty + '</span>'
      + '<button class=qty-btn onclick=changeQty(' + d.id + ',1)>+</button>'
      + '</div></div>'
  }).join('')
  document.getElementById('dishList').innerHTML = html || '<div class=empty-state><div class=big-emoji>🍽️</div>该分类暂无菜品</div>'
}

function renderBottomBar() {
  var items = [], total = 0, count = 0
  for (var did in orders) {
    if (!orders.hasOwnProperty(did) || orders[did] <= 0) continue
    var d = dishes.find(function(dd) { return dd.id == did })
    if (!d) continue
    items.push(d.name + ' ×' + orders[did])
    total += d.price * orders[did]
    count += orders[did]
  }
  document.getElementById('orderSummary').innerHTML = items.length ? items.join('、') : '暂无已选菜品'
  document.getElementById('orderCount').textContent = count + ' 道菜'
  document.getElementById('orderTotal').textContent = '¥' + total.toFixed(2)
}

function renderWishTab() {
  if (wishes.length === 0) {
    document.getElementById('wishList').innerHTML = '<div class=empty-state><div class=big-emoji>💌</div>还没有心愿，快发一个吧</div>'
  } else {
    document.getElementById('wishList').innerHTML = wishes.map(function(w) {
      var isMine = w.from_user === myNick
      var isPending = w.status === 'pending'
      var statusLabel = w.status === 'pending' ? '等待中' : (w.status === 'accepted' ? '✅ 想吃' : '❌ 不想吃')
      var actions = ''
      if (isPending && !isMine) {
        actions = '<div class=wish-actions>'
          + '<button class=btn-accept onclick=respondWish(' + w.id + ',\'accepted\')>😋 想吃</button>'
          + '<button class=btn-reject onclick=respondWish(' + w.id + ',\'rejected\')>🙅 不想吃</button>'
          + '</div>'
      } else if (isPending && isMine) {
        actions = '<div style=font-size:12px;color:#999;text-align:right>等待对方回应...</div>'
      }
      return '<div class=wish-card>'
        + '<div class=wish-top><span class=wish-text>' + w.wish_text + '</span><span class=wish-status ' + w.status + '>' + statusLabel + '</span></div>'
        + '<div class=wish-from>来自：' + w.from_user + '</div>'
        + actions + '</div>'
    }).join('')
  }

  var accepted = wishes.filter(function(w) { return w.status === 'accepted' })
  var rejected = wishes.filter(function(w) { return w.status === 'rejected' })
  var pending = wishes.filter(function(w) { return w.status === 'pending' })
  if (accepted.length > 0 || rejected.length > 0) {
    var verdictHTML = ''
    if (accepted.length > 0) {
      verdictHTML += '<div class=verdict>😋</div><div class=verdict-sub>' + accepted.map(function(w) { return w.wish_text }).join('、') + ' — 达成共识！</div>'
    }
    if (rejected.length > 0) {
      verdictHTML += '<div style=margin-top:8px;font-size:14px;color:#999>❌ ' + rejected.map(function(w) { return w.wish_text }).join('、') + ' 被拒绝了</div>'
    }
    if (pending.length > 0) {
      verdictHTML += '<div style=margin-top:8px;font-size:14px;color:#FF9800>⏳ ' + pending.map(function(w) { return w.wish_text }).join('、') + ' 等待回应</div>'
    }
    document.getElementById('wishResult').innerHTML = '<div class=wish-result><h3>💝 心愿结果</h3>' + verdictHTML + '</div>'
  } else {
    document.getElementById('wishResult').innerHTML = ''
  }
}

// === 操作 ===
function selectCat(cat) { activeCat = cat; renderOrderTab() }

async function changeQty(dishId, delta) {
  var cur = orders[dishId] || 0
  var nxt = Math.max(0, cur + delta)
  try {
    if (nxt === 0) {
      await sbApi('DELETE', '/orders?dish_id=eq.' + dishId)
    } else {
      await sbApi('POST', '/orders', { dish_id: dishId, quantity: nxt, updated_by: myNick, updated_at: new Date().toISOString() })
    }
    loadAll()
  } catch(e) {
    toast('操作失败，请重试')
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active') })
  document.getElementById('orderTab').style.display = tab === 'order' ? 'block' : 'none'
  document.getElementById('wishTab').style.display = tab === 'wish' ? 'block' : 'none'
  document.getElementById('bottomBar').style.display = tab === 'order' ? 'block' : 'none'
  document.querySelectorAll('.tab')[tab === 'order' ? 0 : 1].classList.add('active')
}

async function sendWish() {
  var text = document.getElementById('wishInput').value.trim()
  if (!text) return toast('请输入想吃的东西')
  try {
    await sbApi('POST', '/wishes', { wish_text: text, from_user: myNick, status: 'pending' })
    document.getElementById('wishInput').value = ''
    loadAll()
  } catch(e) {
    toast('发送失败，请重试')
  }
}

async function respondWish(id, status) {
  try {
    await sbApi('PATCH', '/wishes?id=eq.' + id, { status: status, responded_by: myNick })
    loadAll()
  } catch(e) {
    toast('操作失败，请重试')
  }
}

function showAddDish() { document.getElementById('dishModal').classList.remove('hidden') }
function hideAddDish() { document.getElementById('dishModal').classList.add('hidden') }

async function addCustomDish() {
  var name = document.getElementById('newDishName').value.trim()
  var price = parseFloat(document.getElementById('newDishPrice').value)
  var cat = document.getElementById('newDishCat').value
  if (!name || isNaN(price) || price < 0) return toast('请填写完整的菜品信息')
  try {
    await sbApi('POST', '/dishes', { name: name, price: price, category: cat, created_by: myNick })
    document.getElementById('newDishName').value = ''
    document.getElementById('newDishPrice').value = ''
    hideAddDish()
    loadAll()
  } catch(e) {
    toast('添加失败，请重试')
  }
}

function toast(msg) {
  var t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(function() { t.classList.remove('show') }, 2000)
}

init()
</script>
</body>
</html>
